SUPABASE_URL = "https://kzrxedaahwgltzrbuctl.supabase.co"
SUPABASE_KEY = "sb_publishable_BjM67cgulXV01z7nRtaOFQ_uZ_dnEK1"
CLAUDE_MODEL = "claude-opus-5-5"
