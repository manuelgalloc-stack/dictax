name = "dictax"
pages_build_output_dir = "./public"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Whisper speech-to-text (Workers AI)
[ai]
binding = "AI"

# Non-secret settings. Secrets (ANTHROPIC_API_KEY, ACCESS_CODE) are set in the
# Cloudflare dashboard: Settings > Variables and Secrets.
[vars]
CLAUDE_MODEL = "claude-opus-5-5"
# Used for rewriting when ANTHROPIC_API_KEY is not set
CF_TEXT_MODEL = "@cf/google/gemma-4-26b-a4b-it"
